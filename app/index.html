<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Cover Lab — multi-panel cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="brand">
  <h1>Neon <span>Cover Lab</span></h1>
  <p>Turn your photos into multi-panel, neon-sunset cover art. Everything runs on your machine — photos are never uploaded.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <div class="group">
      <h2>1 · Photos</h2>
      <label class="file-label">Add your photos
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div class="row">
        <button type="button" data-sample="pier">Try the pier sample</button>
        <button type="button" data-sample="boulevard">Try the boulevard sample</button>
      </div>
      <div id="photo-strip" class="photo-strip" aria-label="Loaded photos"></div>
    </div>
    <div class="group">
      <h2>2 · Panels</h2>
      <label>Layout
        <select id="layout">
          <option value="poster" selected>Poster collage (5 panels)</option>
          <option value="hero">Hero + side strips</option>
          <option value="cinema">Cinema wide (4 panels)</option>
          <option value="triptych">Triptych (3 tall panels)</option>
          <option value="mosaic">Mosaic grid (6 panels)</option>
        </select>
      </label>
      <div id="panel-bar" class="panel-bar" aria-label="Panels"></div>
      <div class="row">
        <button id="fill-all" type="button">Fill all panels with photo</button>
        <button id="assign-panel" type="button">Put photo in selected panel</button>
      </div>
      <label>Panel zoom <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1"></label>
      <label>Panel shift ↔ <input id="focusX" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      <label>Panel shift ↕ <input id="focusY" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      <p class="hint">Tip: you can also drag the cover to reposition the selected panel.</p>
    </div>
    <div class="group">
      <h2>3 · Words</h2>
      <label>Caption <input id="caption" type="text" maxlength="42" value="Neon Harbor"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="42" value="Vice City Nights"></label>
    </div>
    <div class="group">
      <h2>4 · Look &amp; export</h2>
      <label>Colour grade
        <select id="grade">
          <option value="sunset" selected>Sunset Vice</option>
          <option value="neon">Neon Nights</option>
          <option value="teal">Teal Heat</option>
          <option value="gold">Golden Hour</option>
        </select>
      </label>
      <label>Grade strength <input id="intensity" type="range" min="0" max="1.3" step="0.01" value="0.85"></label>
      <label>Export size
        <select id="size">
          <option value="square">Square post — 1080 × 1080</option>
          <option value="portrait" selected>Portrait post — 1080 × 1350</option>
          <option value="wide">Wide post — 1920 × 1080</option>
        </select>
      </label>
      <button id="export" type="button" class="export-btn">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1350" aria-label="Your cover art preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
